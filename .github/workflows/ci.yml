# Runs on GitHub-hosted runners, free for public repositories. No schedule: only pushes and pull requests.
# It checks what can run without a model: the framework, the known-good slot against the acceptance tests and
# the platform rules, the generator compiling, the Kubernetes manifests rendering. The model runs are in docs/results.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Framework and the known-good slot
        run: make reference-check
      - name: Generator compiles, and reports NOT RUN when no model is reachable
        run: |
          set +e
          java generator/Generator.java --run-id ci --ollama-url http://127.0.0.1:1 --attempts 1
          test $? -eq 2
      - name: The harness takes the method body out of a reply, ignoring braces in strings and comments
        run: |
          mkdir -p /tmp/mbt
          javac -d /tmp/mbt generator/Generator.java generator/test/MethodBodyTest.java
          java -cp /tmp/mbt MethodBodyTest
      - name: Kubernetes manifests render
        run: kubectl kustomize k8s/base >/dev/null && kubectl kustomize k8s/gpu >/dev/null
